name = "unified_verified_matching_engine"
version = "0.1.0"
defaultTargets = ["UnifiedVerifiedMatchingEngine", "Walk"]

[[require]]
name = "Amcc"
path = "../amcc"

[[lean_lib]]
name = "MatchingEngine"
srcDir = "lean"

[[lean_lib]]
name = "Bridge"
srcDir = "lean"

[[lean_lib]]
name = "UnifiedVerifiedMatchingEngine"
srcDir = "lean"

[[lean_lib]]
name = "Matcher"
srcDir = "lean"

[[lean_exe]]
name = "spec_oracle"
root = "Matcher.Oracle"
srcDir = "lean"

[[lean_exe]]
name = "semtest"
root = "Matcher.SemTestMain"
srcDir = "lean"

[[lean_exe]]
name = "semvalid"
root = "Matcher.SemValid"
srcDir = "lean"

[[lean_lib]]
name = "Walk"
srcDir = "lean"
globs = ["Walk.+"]
